<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fan Arena 0.1 · 独立演示（QA 用，不随正式产品分发）</title>
<style>body{font-family:system-ui,sans-serif;background:#0a0a0f;color:#f2ede0;max-width:900px;margin:0 auto;padding:20px}button{padding:8px 14px;border-radius:8px;border:0;background:#c9a227;color:#111;margin-right:8px}select{padding:8px;margin:4px}.board{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;background:#14141c;border:1px solid #2a2a35;border-radius:12px;padding:20px;text-align:center}.score{font-size:40px;color:#e8c766}.card{background:#14141c;border:1px solid #2a2a35;border-radius:12px;padding:16px;margin:14px 0}.err{color:#ff8a8a}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}</style>
</head><body>
<h1>Fan Arena · 模拟比赛</h1>
<p>明确标注的模拟数据，非真实比赛、非真实运动员、无现金价值奖励、无博彩功能。单局演示：赢下本局即赢下本场模拟赛，不冒充完整多局赛事。数据只存在本页浏览器的 localStorage，不写正式数据库。</p>
<div class="board"><div><b style="color:#e5484d">雷霆</b><br><small>模拟球员</small></div><div class="score" id="score">0 : 0</div><div><b style="color:#5b9dff">磐石</b><br><small>模拟球员</small></div></div>
<p id="status" role="status">进行中 · 已进行 0 分</p>
<button id="advance">推进一分</button><button id="critical">推进到下一关键分</button><button id="new">开始新比赛</button>
<div class="card">
<label>预测类型 <select id="type"><option value="NEXT_POINT">下一分由谁获得？</option><option value="FIRST_TO_GAME_POINT">本局谁先拿到局点？</option><option value="GAME_WINNER">这一局谁获胜？</option></select></label>
<label>你的选择 <select id="choice"><option value="A">雷霆</option><option value="B">磐石</option></select></label>
<button id="lock">锁定预测</button><p>锁定后不能修改；结果按唯一预测 ID 揭晓，重复揭晓不会重复计分。</p>
</div>
<p id="msg" role="status"></p><p id="err" class="err" role="alert"></p>
<div class="card"><h3>本场比赛预测</h3><ul id="current"></ul></div>
<div class="card"><h3>个人记录</h3><p id="stats"></p><ul id="history"></ul></div>
<p><small>返回 Cinema 时，本页状态保存在浏览器隔离存储里。比赛结束总结见下方状态。</small></p>
<script type="module">
import {advancePoint,advanceToCriticalResolved,createMatch,createPrediction,readArenaSnapshot,matchStatus,resolvePredictions,saveArenaState,scoreHistory} from '../../frontend/src/fanArenaEngine.mjs';
const LABEL={NEXT_POINT:'下一分由谁获得？',FIRST_TO_GAME_POINT:'本局谁先拿到局点？',GAME_WINNER:'这一局谁获胜？'};
let snapshot;try{snapshot=readArenaSnapshot(localStorage)}catch{snapshot=readArenaSnapshot(null)}
let {match,predictions,history}=snapshot;
const $=id=>document.getElementById(id);
function rows(id,values,empty){const nodes=values.length?values.map(text=>{const n=document.createElement('li');n.textContent=text;return n}):[Object.assign(document.createElement('li'),{textContent:empty})];$(id).replaceChildren(...nodes)}
function render(){
 $('score').textContent=`${match.scoreA} : ${match.scoreB}`;
 $('status').textContent=`${matchStatus(match).label} · 已进行 ${match.pointIndex} 分`;
 rows('current',predictions.map(p=>`${LABEL[p.type]} · ${p.choice==='A'?'雷霆':'磐石'} · ${p.status==='RESOLVED'?(p.correct?'正确 ✓':'错误 ✗'):'已锁定'}`),'还没有预测。');
 const s=scoreHistory(history);$('stats').textContent=`已揭晓 ${s.total} 次 · 正确 ${s.correct} 次 · 正确率 ${s.accuracy}%`;
 rows('history',history.map(p=>`${LABEL[p.type]} · ${p.choice==='A'?'雷霆':'磐石'} · ${p.correct?'正确 ✓':'错误 ✗'}`),'还没有已揭晓的预测。');
 for(const id of ['advance','critical','lock'])$(id).disabled=!snapshot.writable||match.status==='FINISHED';$('new').disabled=!snapshot.writable;
}
function commit(next,message){$('msg').textContent='';let saved=false;try{saved=snapshot.writable&&saveArenaState(localStorage,next)}catch{}if(!saved){$('err').textContent='保存失败：操作未生效，原存档与比分保留。';return}({match,predictions,history}=next);$('err').textContent='';$('msg').textContent=message;render()}
function apply(next,preds,newly){commit({match:next,predictions:preds,history:[...history,...newly.filter(p=>!history.some(old=>old.id===p.id))]},newly.length?'预测已揭晓':'比分已推进')}
$('advance').onclick=()=>{const next=advancePoint(match);if(!next.advanced)return;const out=resolvePredictions(predictions,next.match,match);apply(next.match,out.predictions,out.predictions.filter(p=>p.status==='RESOLVED'&&!predictions.some(old=>old.id===p.id&&old.status==='RESOLVED')))};
$('critical').onclick=()=>{const out=advanceToCriticalResolved(match,predictions);apply(out.match,out.predictions,out.resolved)};
$('lock').onclick=()=>{const out=createPrediction(predictions,match,$('type').value,$('choice').value);if(out.errors.length){$('msg').textContent=out.errors.join('；');return}commit({match,predictions:out.predictions,history},'预测已锁定')};
$('new').onclick=()=>commit({match:createMatch(),predictions:[],history},'新模拟局已开始，已结算历史保留');
$('err').textContent=snapshot.error;render();
</script></body></html>
