<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PTTI Moment Cards · 独立演示（QA 用，不随正式产品分发）</title>
<style>body{font-family:system-ui,sans-serif;background:#0b0d10;color:#eee;max-width:900px;margin:0 auto;padding:20px}label{display:block;margin:10px 0}input,select,textarea{width:100%;padding:8px;margin-top:4px;background:#1a1e24;color:#eee;border:1px solid #333;border-radius:8px}button{padding:8px 14px;border-radius:8px;border:0;background:#2b6cff;color:#fff;margin-right:8px}.card{background:#15181d;border-radius:12px;padding:14px;margin:12px 0}.tag{display:inline-block;background:#222;padding:2px 8px;border-radius:12px;margin-right:6px;font-size:12px}.err{color:#ff8a8a}</style>
</head><body>
<h1>Moment Cards · 独立演示</h1>
<p>这是一个不依赖 React / 后端的演示页，只验证时刻逻辑和交互。数据只存在本页浏览器的 localStorage（键 ptti-moment-cards-demo-v1），不写正式数据库，不下载、不剪辑、不分发比赛视频。种子比赛来自包内官方来源的 3 条公开标题与链接，仅用于选赛演示。</p>
<label>比赛 <select id="video"></select></label>
<label>时间戳 <input id="ts" placeholder="如 12:34 或 1:02:03"></label>
<label>时刻名称 <input id="title" placeholder="如 关键分反手变线" maxlength="60"></label>
<label>个人备注 <textarea id="note" placeholder="当时为什么这样打？下次想改什么？" maxlength="500"></textarea></label>
<label>标签 <input id="tags" placeholder="用逗号分隔，如 关键分, 发球"></label>
<p id="err" class="err"></p>
<button id="save">保存时刻</button><button id="clear">取消编辑</button>
<div id="list"></div>
<script type="module" src="./demo.mjs"></script></body></html>
